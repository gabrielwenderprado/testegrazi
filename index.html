<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Simulado interativo de Desenvolvimento Web">
  <title>Simulado — Desenvolvimento Web</title>
  <style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#667085;--primary:#2563eb;--primary-dark:#1d4ed8;--line:#e5e7eb;--ok:#15803d;--ok-bg:#dcfce7;--bad:#b91c1c;--bad-bg:#fee2e2;--accent:#7c3aed}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef4ff,#f8fafc);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:980px;margin:auto;padding:24px 16px 48px}.hero{background:linear-gradient(135deg,#1e3a8a,#2563eb 55%,#7c3aed);color:#fff;border-radius:24px;padding:30px 28px;margin-bottom:18px;box-shadow:0 16px 35px #1e3a8a2b}.hero h1{margin:0 0 8px;font-size:clamp(1.7rem,4vw,2.55rem)}.hero p{margin:0;color:#e0e7ff}.toolbar,.question,.result{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 7px 20px #1018280b}.toolbar{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:15px 18px;margin-bottom:16px;flex-wrap:wrap}.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:.95rem}.stats strong{color:var(--ink)}.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}button{border:0;border-radius:10px;padding:11px 17px;font-weight:700;cursor:pointer;font-size:.95rem;transition:.2s}button:hover{transform:translateY(-1px)}.primary{background:var(--primary);color:white}.primary:hover{background:var(--primary-dark)}.secondary{background:#eef2ff;color:#3730a3}.ghost{background:#f8fafc;color:#475467;border:1px solid var(--line)}.danger{background:#fff1f2;color:#be123c;border:1px solid #fecdd3}.question{padding:24px;display:none}.question.active{display:block}.q-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}.badge{background:#dbeafe;color:#1d4ed8;border-radius:999px;padding:5px 10px;font-weight:800;font-size:.85rem;white-space:nowrap}.prompt{font-size:1.08rem;font-weight:650;margin:0;white-space:pre-line}.context{background:#f8fafc;border-left:4px solid #93c5fd;padding:13px 15px;margin:16px 0;border-radius:8px;white-space:pre-line;font-family:inherit}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;background:#111827;color:#e5e7eb;border-radius:10px;padding:14px;margin:14px 0;overflow:auto;font-size:.9rem}.options{display:grid;gap:10px;margin-top:17px}.option{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;transition:.15s}.option:hover{border-color:#93c5fd;background:#eff6ff}.option input{margin-top:5px;accent-color:var(--primary);transform:scale(1.15)}.option.selected{border-color:#60a5fa;background:#eff6ff}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.dots{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}.dot{width:27px;height:27px;border-radius:50%;font-size:.75rem;padding:0;background:#f2f4f7;color:#667085}.dot.current{background:var(--primary);color:#fff}.dot.done{background:#bfdbfe;color:#1e40af}.result{display:none;padding:26px}.result.show{display:block}.score{font-size:3rem;font-weight:850;color:var(--primary);margin:4px 0}.review{margin-top:24px;border-top:1px solid var(--line)}.review-item{padding:16px 0;border-bottom:1px solid var(--line)}.review-item strong{display:block;margin-bottom:5px}.correct{color:var(--ok);background:var(--ok-bg);padding:9px 11px;border-radius:9px}.incorrect{color:var(--bad);background:var(--bad-bg);padding:9px 11px;border-radius:9px}.explain{color:var(--muted);font-size:.93rem;margin-top:7px}.hidden{display:none!important}.footer{text-align:center;color:var(--muted);font-size:.88rem;margin-top:18px}@media(max-width:600px){.hero{padding:24px 20px}.question,.result{padding:18px}.toolbar{align-items:flex-start}.nav button{flex:1}}
    .no-script{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;border-radius:12px;padding:14px 16px;margin:0 0 16px;font-weight:600}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <h1>Simulado — Desenvolvimento Web</h1>
      <p>17 questões sobre .NET, ASP.NET Core, APIs REST, MVC, EF Core, Dapper, ADO.NET e Razor.</p>
    </header>
    <noscript><div class="no-script">Este simulado precisa do JavaScript ativado. Abra o arquivo no Chrome, Safari, Edge ou Firefox.</div></noscript>
    <section class="toolbar" id="toolbar">
      <div class="stats">
        <span>Questão <strong id="current">1</strong> de <strong id="total">17</strong></span>
        <span>Respondidas: <strong id="answered">0</strong></span>
        <span class="timer" id="timer">Tempo: 60:00</span>
      </div>
      <div class="toolbar-actions">
        <button class="secondary" id="toggleTimer" type="button">Pausar cronômetro</button>
        <button class="danger" id="finishTop" type="button">Finalizar</button>
      </div>
    </section>
    <main id="quiz" aria-live="polite"></main>
    <section class="result" id="result" aria-live="polite">
      <h2>Resultado</h2>
      <div class="score" id="score">0/17</div>
      <p id="message"></p>
      <button class="primary" id="retry" type="button">Refazer simulado</button>
      <div class="review" id="review"></div>
    </section>
    <p class="footer">Dica: tente responder sem consultar o gabarito. Ao finalizar, veja seus erros e revise os temas.</p>
  </div>
  <script>
const questions=[
{q:'Uma empresa pretende desenvolver um sistema com aplicação Web, API e futuramente aplicações mobile. Sobre a plataforma .NET, analise as afirmações:',c:'I. A plataforma .NET permite desenvolver aplicações Web, APIs, desktop e mobile.\nII. O .NET moderno suporta Windows, Linux e macOS.\nIII. O ASP.NET Core substitui completamente o .NET e é usado exclusivamente para aplicações mobile.',o:['I, apenas.','II, apenas.','I e II, apenas.','II e III, apenas.','I, II e III.'],a:2,e:'A afirmação III é falsa: ASP.NET Core é uma estrutura para aplicações Web, não substitui o .NET nem é exclusiva para mobile.'},
{q:'Um aluno faz login em um sistema acadêmico pelo navegador. O navegador envia os dados ao servidor, que processa a solicitação e retorna uma resposta. Assinale a alternativa correta.',o:['O navegador consulta diretamente o banco de dados, sem o servidor.','O servidor apenas apresenta telas e não realiza processamento.','O cliente envia uma requisição ao servidor, que processa a solicitação e retorna uma resposta.','HTTP é usado somente para armazenar informações no banco.','A arquitetura cliente-servidor elimina a comunicação entre navegador e servidor.'],a:2,e:'Na arquitetura cliente-servidor, o cliente faz a requisição e o servidor processa e devolve a resposta.'},
{q:'Uma API REST precisa consultar todos os clientes, cadastrar um cliente, atualizar o cliente 10 e excluir o cliente 10. Qual conjunto de métodos está correto?',o:['GET /clientes → cadastrar; POST /clientes → consultar; PUT /clientes/10 → excluir; DELETE /clientes/10 → atualizar.','GET /clientes → consultar; POST /clientes → cadastrar; PUT /clientes/10 → atualizar; DELETE /clientes/10 → excluir.','POST /clientes → consultar; GET /clientes → cadastrar; DELETE /clientes/10 → atualizar; PUT /clientes/10 → excluir.','GET /clientes → excluir; POST /clientes → atualizar; PUT /clientes/10 → consultar; DELETE /clientes/10 → cadastrar.','PUT /clientes → consultar; GET /clientes → atualizar; POST /clientes/10 → excluir; DELETE /clientes/10 → cadastrar.'],a:1,e:'Em REST, GET consulta, POST cadastra, PUT atualiza e DELETE exclui.'},
{q:'Uma API recebe GET /produtos e retorna um objeto JSON com id, nome, preco e estoque. Analise:',c:'I. /produtos representa o recurso acessado.\nII. GET indica consulta ou obtenção de informações.\nIII. JSON usa pares de chave e valor.\nIV. JSON é usado exclusivamente por aplicações JavaScript.',o:['I e II, apenas.','II e IV, apenas.','I, II e III, apenas.','I, III e IV, apenas.','I, II, III e IV.'],a:2,e:'JSON é independente de linguagem e pode ser usado por diversas tecnologias; por isso, IV é falsa.'},
{q:'Em um projeto ASP.NET Core, associe cada situação ao componente correto:',c:'Situação 1: classes de entidades como Cliente e Produto.\nSituação 2: receber requisições HTTP e definir a ação.\nSituação 3: comunicação com o banco via Entity Framework Core.\nSituação 4: configuração inicial e serviços.',o:['1 → Controllers; 2 → Models; 3 → Program.cs; 4 → Data.','1 → Models; 2 → Controllers; 3 → Data/DbContext; 4 → Program.cs.','1 → Data; 2 → Models; 3 → Controllers; 4 → appsettings.json.','1 → Program.cs; 2 → Data; 3 → Models; 4 → Controllers.','1 → appsettings.json; 2 → Data; 3 → Program.cs; 4 → Models.'],a:1,e:'Models representam dados, Controllers tratam requisições, Data/DbContext acessa o banco e Program.cs configura a aplicação.'},
{q:'Em uma aplicação ASP.NET Core, a requisição passa por middlewares, roteamento, endpoint/controller e retorna ao cliente. Assinale a correta.',o:['Middleware serve exclusivamente para criar tabelas.','O pipeline HTTP é a sequência de etapas percorridas pela requisição dentro da aplicação.','O Controller sempre é executado antes dos middlewares.','O pipeline HTTP existe somente em aplicações desktop.','Middleware substitui completamente Controllers.'],a:1,e:'O pipeline HTTP organiza a passagem das requisições pelos middlewares e demais componentes.'},
{q:'Sobre appsettings.json e DbContext em uma aplicação ASP.NET Core, assinale a correta.',c:'O appsettings.json pode conter uma seção ConnectionStrings com os dados de acesso ao banco.',o:['appsettings.json recebe requisições e executa Controllers.','DbContext serve somente para criar páginas HTML.','appsettings.json armazena configurações, como strings de conexão, enquanto DbContext comunica-se com o banco.','appsettings.json substitui o banco de dados.','DbContext recebe diretamente as requisições do navegador e substitui HTTP.'],a:2,e:'O arquivo guarda configurações; o DbContext representa a camada de acesso e gerenciamento dos dados.'},
{q:'Para GET /usuarios/10, qual é a sequência mais adequada no processamento de uma requisição HTTP no ASP.NET Core?',o:['Cliente → Endpoint → Middleware → Roteamento → Model Binding → Resposta HTTP.','Cliente → Middleware → Roteamento → Endpoint → Model Binding → Resposta HTTP.','Cliente → Roteamento → Cliente → Middleware → Endpoint → Resposta HTTP.','Cliente → Model Binding → Middleware → Roteamento → Endpoint → Resposta HTTP.','Cliente → Resposta HTTP → Middleware → Roteamento → Endpoint → Model Binding.'],a:1,e:'A requisição entra no pipeline de middlewares, passa pelo roteamento, chega ao endpoint, realiza binding e gera a resposta.'},
{q:'Rotas cadastradas: GET /usuarios, GET /usuarios/{id}, GET /produtos e GET /clientes. Para GET /usuarios/25, qual rota atende?',o:['GET /usuarios, pois o caminho começa com /usuarios.','GET /produtos, pois GET representa consulta.','GET /usuarios/{id}, pois aceita um valor no parâmetro {id}.','O roteamento cria automaticamente /usuarios/25.','Nenhuma, pois {id} deve ser substituído antes da requisição.'],a:2,e:'O segmento 25 corresponde ao parâmetro dinâmico {id} da rota /usuarios/{id}.'},
{q:'Após o roteamento identificar GET /usuarios/{id} para a requisição GET /usuarios/10, o que faz o Model Binding?',o:['Altera a rota /usuarios/{id} para /usuarios/10.','Identifica que 10 foi enviado pelo cliente e o vincula ao parâmetro id.','Cria um endpoint chamado /usuarios/10.','Verifica autorização do usuário.','Escolhe qual rota será utilizada.'],a:1,e:'Model Binding converte e associa valores da requisição aos parâmetros da ação, como id = 10.'},
{q:'Em uma Minimal API foi criado app.MapGet("/usuarios", () => { return new[] { "Ana", "João", "Maria" }; });. Assinale a correta.',o:['Está incorreto: todo endpoint deve estar em um Controller.','MapGet cria um endpoint GET para /usuarios sem necessidade de Controller.','MapGet serve exclusivamente para criar Views HTML.','/usuarios é o nome do Controller criado automaticamente.','Minimal API só deve ser usada com muitos Controllers e regras complexas.'],a:1,e:'Minimal APIs permitem declarar endpoints diretamente, sem a necessidade de Controllers.'},
{q:'No padrão MVC, associe as responsabilidades: I. representar dados de um aluno; II. receber requisição e processar; III. apresentar tela HTML.',o:['I – View; II – Model; III – Controller.','I – Controller; II – View; III – Model.','I – Model; II – Controller; III – View.','I – Model; II – View; III – Controller.','I – View; II – Controller; III – Model.'],a:2,e:'Model representa dados, Controller processa requisições e View apresenta a interface.'},
{q:'Considere var aluno = context.Alunos.Find(1); no Entity Framework Core. Analise:',c:'I. context representa o DbContext.\nII. Alunos é um DbSet que representa entidades Aluno.\nIII. Find(1) procura uma entidade cuja chave primária é 1.\nIV. EF Core exige escrever manualmente um SELECT para cada consulta.',o:['I e II, apenas.','I, II e III, apenas.','II, III e IV, apenas.','I, III e IV, apenas.','I, II, III e IV.'],a:1,e:'I, II e III são verdadeiras. O EF Core pode gerar o SQL a partir das operações do código, então IV é falsa.'},
{q:'Sobre migrations, dados iniciais e conexões no Entity Framework Core, assinale a alternativa correta.',c:'A equipe adicionou Email à classe Aluno, executou Add-Migration AdicionarEmail e Update-Database, usou HasData() e deseja reutilizar conexões.',o:['Add-Migration insere dados iniciais diretamente; HasData cria conexão.','Update-Database cria o Model C#; DbSet atualiza conexões.','Migration registra alterações do Model e pode ser aplicada com Update-Database; HasData define dados iniciais e Connection Pooling reutiliza conexões.','Seed altera apenas estrutura; Migration consulta registros.','Connection Pooling cria uma conexão nova para cada consulta, evitando compartilhamento.'],a:2,e:'Migration versiona mudanças do modelo, Update-Database aplica-as, HasData configura seed e pooling reaproveita conexões.'},
{q:'Em uma View Index.cshtml, o Razor é usado para percorrer Model e gerar <p>@produto.Nome - @produto.Preco</p>. Assinale a correta.',o:['Razor é uma linguagem independente usada para substituir C#.','Razor executa no navegador e transforma C# em HTML no computador do usuário.','Razor permite inserir C# no HTML e gerar páginas dinamicamente no servidor, principalmente nas Views MVC.','Razor acessa diretamente o banco e substitui EF Core.','@ serve somente para comentários em .cshtml.'],a:2,e:'Razor combina marcação HTML com C# no servidor para produzir HTML dinamicamente.'},
{q:'No Dapper, connection.Query<Aluno>("SELECT * FROM Alunos") é executado após abrir uma SqlConnection. Assinale a correta.',o:['Dapper gera automaticamente o SQL a partir de Aluno, sem SELECT.','Query<Aluno>() executa a consulta SQL e transforma os resultados em objetos Aluno.','Dapper substitui o banco e armazena alunos na memória.','connectionString representa a tabela Alunos.','Dapper só consulta o banco por meio do EF Core.'],a:1,e:'Dapper é um micro-ORM que executa o SQL fornecido e mapeia as linhas retornadas para objetos.'},
{q:'Em ADO.NET, uma SqlConnection é aberta e um SqlCommand("SELECT * FROM Alunos", connection) é executado com ExecuteReader(). Assinale a correta.',o:['SqlConnection estabelece a conexão com o banco, enquanto SqlCommand representa o comando SQL executado.','SqlConnection representa a tabela Alunos e SqlCommand cria automaticamente uma tabela.','connectionString contém os dados dos alunos exibidos.','ExecuteReader altera automaticamente dados e não pode ser usado em consultas.','ADO.NET não permite SQL direto; é obrigatório usar EF Core.'],a:0,e:'SqlConnection gerencia a conexão, SqlCommand encapsula o comando e ExecuteReader lê os resultados.'}
];
const letters=['A','B','C','D','E'];let current=0,answers=Array(questions.length).fill(null),seconds=3600,running=true;
const quiz=document.getElementById('quiz');document.getElementById('total').textContent=questions.length;
function render(){quiz.innerHTML=questions.map((x,i)=>`<article class="question ${i===current?'active':''}" data-i="${i}"><div class="q-head"><span class="badge">Questão ${i+1}</span><p class="prompt">${x.q}</p></div>${x.c?`<div class="context">${x.c}</div>`:''}<div class="options">${x.o.map((opt,j)=>`<label class="option ${answers[i]===j?'selected':''}"><input type="radio" name="q${i}" value="${j}" ${answers[i]===j?'checked':''}> <span><strong>${letters[j]})</strong> ${opt}</span></label>`).join('')}</div><div class="nav"><button class="ghost" onclick="go(${i-1})" ${i===0?'disabled':''}>← Anterior</button>${i===questions.length-1?'<button class="primary" onclick="finish()">Finalizar prova</button>':`<button class="primary" onclick="go(${i+1})">Próxima →</button>`}</div></article>`).join('');
quiz.querySelectorAll('input').forEach(input=>input.addEventListener('change',e=>{answers[+e.target.name.slice(1)]=+e.target.value;update()}));document.getElementById('current').textContent=current+1;update();}
function update(){document.getElementById('answered').textContent=answers.filter(x=>x!==null).length;document.querySelectorAll('.option').forEach(x=>{let r=x.querySelector('input');x.classList.toggle('selected',r.checked)});}
function go(i){if(i<0||i>=questions.length)return;current=i;render();window.scrollTo({top:0,behavior:'smooth'})}
function finish(){if(!answers.some(x=>x!==null)||confirm('Finalizar agora? Questões sem resposta serão consideradas erradas.')){clearInterval(clock);document.getElementById('toolbar').classList.add('hidden');quiz.classList.add('hidden');const result=document.getElementById('result');result.classList.add('show');let score=answers.reduce((n,x,i)=>n+(x===questions[i].a?1:0),0);document.getElementById('score').textContent=`${score}/${questions.length} — ${Math.round(score/questions.length*100)}%`;document.getElementById('message').textContent=score>=14?'Excelente! Você está muito bem preparado.':score>=10?'Bom resultado! Revise os pontos indicados abaixo.':'Continue estudando e refaça o simulado após revisar os temas.';document.getElementById('review').innerHTML=questions.map((x,i)=>{let ok=answers[i]===x.a;return `<div class="review-item"><strong>${i+1}. ${ok?'✓ Correta':'✗ Para revisar'}</strong><div class="${ok?'correct':'incorrect'}">Sua resposta: ${answers[i]===null?'não respondida':letters[answers[i]]} · Gabarito: ${letters[x.a]} — ${x.o[x.a]}</div><div class="explain">${x.e}</div></div>`}).join('');window.scrollTo({top:0,behavior:'smooth'})}}
function formatTime(){let m=String(Math.floor(seconds/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');document.getElementById('timer').textContent=`Tempo: ${m}:${s}`}
const clock=setInterval(()=>{if(running&&seconds>0){seconds--;formatTime()}else if(seconds===0){running=false;finish()}},1000);
document.getElementById('toggleTimer').onclick=()=>{running=!running;document.getElementById('toggleTimer').textContent=running?'Pausar cronômetro':'Retomar cronômetro'};document.getElementById('finishTop').onclick=finish;document.getElementById('retry').onclick=()=>location.reload();render();
  </script>
</body>
</html>
